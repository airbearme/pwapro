name: Basic Build Check

on:
  push:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
      NEXT_PUBLIC_SUPABASE_PWA4_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PWA4_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
      SUPABASE_PWA4_SERVICE_ROLE_KEY: dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      NEXT_PUBLIC_SITE_URL: https://airbear.me
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build check
        run: pnpm run build
        
      - name: Test deployment URL
        run: |
          echo "✅ Build successful!"
          echo "🚀 Deployment should be available at: https://airbear.me"
