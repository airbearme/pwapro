name: Code Quality & Formatting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  # Code Formatting
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: |
          # Only check changed files to avoid pre-existing issues
          git fetch origin main --depth=1 || true
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.(js|jsx|ts|tsx|json|css|md)$' | grep -v 'node_modules' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Checking: $CHANGED_FILES"
            npx prettier --check $CHANGED_FILES
          else
            echo "No changed files to check."
          fi

      - name: Auto-fix formatting (if on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          npx prettier --write "**/*.{js,jsx,ts,tsx,json,css,md}"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "style: auto-format code" || echo "No formatting changes to commit"

  # Lint and Fix
  lint-fix:
    name: Lint & Auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with auto-fix
        run: |
          # Only check changed files to avoid pre-existing issues
          git fetch origin main --depth=1 || true
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.(ts|tsx|js|jsx)$' | grep -v 'node_modules' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Checking: $CHANGED_FILES"
            npx eslint --fix $CHANGED_FILES
          else
            echo "No changed files to check."
          fi

      - name: Commit auto-fixes (if on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "fix: auto-fix linting issues" || echo "No linting fixes to commit"

  # TypeScript Strict Mode Check
  typescript-strict:
    name: TypeScript Strict Mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict mode check
        run: npx tsc --noEmit --strict

  # Import Sorting
  import-sort:
    name: Import Sorting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sort imports
        run: |
          # Only check changed files to avoid pre-existing issues
          git fetch origin main --depth=1 || true
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.(ts|tsx|js|jsx)$' | grep -v 'node_modules' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Checking: $CHANGED_FILES"
            npx eslint --fix --rule 'import/order: error' $CHANGED_FILES
          else
            echo "No changed files to check."
          fi

      - name: Commit import sorting (if on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "refactor: sort imports" || echo "No import changes to commit"

  # Dead Code Detection
  dead-code:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect dead code
        run: npx unimported

      - name: Upload dead code report
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-report
          path: unimported-*.json